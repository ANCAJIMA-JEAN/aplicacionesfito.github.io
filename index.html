<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gantt Fitosanitario</title>
<style>
:root{--g:#1b5e20;--g2:#2e7d32;--bg:#f3f5f3;--bd:#dfe4df;--tx:#1d2b1f}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;color:var(--tx);background:var(--bg);display:flex;height:100vh}
nav{width:200px;background:var(--g);color:#fff;padding:14px 8px;flex-shrink:0}
nav h1{font-size:15px;margin:0 8px 14px}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#d7ecd8;padding:10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on,nav button:hover{background:#ffffff22;color:#fff}
main{flex:1;overflow:auto;padding:16px}
.demo{background:#fff8e1;border:1px solid #ffe082;padding:6px 10px;border-radius:8px;margin-bottom:12px;font-size:12px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
button.b,select,input{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff}
button.b{cursor:pointer}button.p{background:var(--g2);color:#fff;border-color:var(--g2)}button.d{color:#c62828}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card,.box{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px}
.card b{display:block;font-size:24px;color:var(--g2)}
.gantt{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;min-width:720px}
.gr{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--bd)}
.gh{background:#e8f0e8;font-weight:600;border-top:0}
.gl{padding:8px;border-right:1px solid var(--bd);font-size:13px}.gl small{display:block;color:#667}
.dys{position:relative;display:grid;grid-template-columns:repeat(6,1fr)}
.dys>i{border-right:1px solid var(--bd);min-height:34px}.gh .dys>div{padding:6px;text-align:center;border-right:1px solid var(--bd)}
.ev{position:absolute;height:24px;border-radius:6px;padding:2px 8px;font-size:12px;overflow:hidden;white-space:nowrap;cursor:grab;touch-action:none;user-select:none;box-shadow:0 1px 2px #0003}
.ev.rp{text-decoration:line-through;opacity:.55}.ev .h{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;background:#0003}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bd);border-radius:12px}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left}th{background:#e8f0e8}
.tag{font-size:11px;padding:1px 6px;border-radius:10px;background:#ffcdd2;color:#b71c1c}.tag.ok{background:#c8e6c9;color:#1b5e20}
#side{position:fixed;right:0;top:0;bottom:0;width:340px;background:#fff;border-left:1px solid var(--bd);box-shadow:-4px 0 12px #0002;padding:16px;overflow:auto;transform:translateX(100%);transition:.2s}
#side.open{transform:none}#side label{display:block;margin:8px 0 2px;font-size:12px;color:#556}#side input,#side select{width:100%}
.res{background:#e8f5e9;border-radius:8px;padding:8px;margin-top:8px}
.hb{height:14px;background:var(--g2);border-radius:4px}
</style></head><body>
<nav><h1>🫐 Programación<br>Fitosanitaria</h1><div id="menu"></div></nav>
<main><div class="demo">⚠ DATOS DE EJEMPLO: productos, dosis y hectáreas son ilustrativos. Se reemplazan al cargar el Excel real.</div><div id="v"></div></main>
<aside id="side"></aside>
<script>
/* ===== Utilidades ===== */
const $=s=>document.querySelector(s),DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb'];
const iso=d=>d.toISOString().slice(0,10),add=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const monday=(y,w)=>{const j=new Date(Date.UTC(y,0,4)),d=j.getUTCDay()||7;j.setUTCDate(j.getUTCDate()-d+1+(w-1)*7);return iso(j)};
const isoWeek=d=>{d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return[d.getUTCFullYear(),Math.ceil(((d-y)/864e5+1)/7)]};
const dayIdx=(s,m)=>Math.round((new Date(s)-new Date(m))/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
const tc=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>150?'#111':'#fff'};
function calc(d,u,moj,cap,ha){const[n,den]=u.split('/'),b={mL:1,L:1000,g:1,kg:1000}[n];if(!b||!['cil','L','ha'].includes(den))return null;
 const cph=moj/cap;const ph=den=='cil'?d*b*cph:den=='L'?d*b*moj:d*b;return{cph,pc:ph/cph,ph,tot:ph*ha,cil:Math.ceil(cph*ha),u:(n=='mL'||n=='L')?'mL':'g'}}
const big=(v,u)=>v>=1000?(v/1000).toFixed(2)+(u=='mL'?' L':' kg'):(+v.toFixed(2))+' '+u;
const sv=(a,p)=>{/* Etapa 7: aquí se llamará google.script.run.api(a,p) */};

/* ===== Datos de ejemplo ===== */
const [Y0,W0]=isoWeek(new Date());
const S={y:Y0,w:W0,tab:'gantt',cap:200,
 sec:[['O1E1','Olmos 1 - Equipo 1','Olmos 1',10],['O1E2','Olmos 1 - Equipo 2','Olmos 1',12],['O2E1','Olmos 2 - Equipo 1','Olmos 2',8],
      ['O2E2','Olmos 2 - Equipo 2','Olmos 2',9],['O3E1','Olmos 3 - Equipo 1','Olmos 3',11],['O3E2','Olmos 3 - Equipo 2','Olmos 3',7],['JV','Jardín Varietal','Jardín Varietal',2]]
  .map(a=>({id:a[0],nombre:a[1],fundo:a[2],ha:a[3],act:true})),
 prod:[['CAP Ajo','mL/L',0.25,'#43a047'],['Fitoplasus','mL/L',0.5,'#8e24aa'],['Acidificador','mL/L',0.3,'#fdd835'],['Botamisol','g/L',0.2,'#1e88e5'],['Alcalig Duo','mL/cil',100,'#fb8c00']]
  .map(a=>({id:a[0],nombre:a[0],u:a[1],dosis:a[2],min:'',max:'',moj:200,color:a[3],aut:true})),
 it:[],hist:[]};
const M0=monday(S.y,S.w);
[['O1E1','CAP Ajo',0,2],['O1E1','Acidificador',0,1],['O1E1','Botamisol',1,3],['O1E2','Fitoplasus',1,3],['O1E2','Alcalig Duo',2,4],['O2E1','CAP Ajo',3,5]]
 .forEach(a=>{const p=S.prod.find(x=>x.id==a[1]);S.it.push({id:uid(),sec:a[0],pid:p.id,nombre:p.nombre,reg:true,ini:add(M0,a[2]),fin:add(M0,a[3]),d0:p.dosis,d:p.dosis,u:p.u,moj:p.moj,est:'ACTIVO',obs:''})});
const log=(tipo,it,x={})=>S.hist.unshift(Object.assign({f:new Date().toLocaleString(),tipo,sec:it.sec,prod:it.nombre,usr:'usuario'},x));
const col=n=>(S.prod.find(p=>p.id==n)||{color:'#9e9e9e'}).color;
const weekItems=()=>{const m=monday(S.y,S.w),e=add(m,5);return S.it.filter(i=>i.est!='ELIMINADO'&&i.ini<=e&&i.fin>=m)};

/* ===== Navegación ===== */
const TABS=[['dash','📊 Dashboard'],['gantt','📅 Gantt semanal'],['prog','🧪 Programación'],['maes','📦 Maestro de productos'],['sect','🏢 Sectores'],['hist','🕘 Historial'],['conf','⚙ Configuración']];
function go(t){S.tab=t;$('#side').classList.remove('open');$('#menu').innerHTML=TABS.map(x=>`<button class="${x[0]==t?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
 ({dash:vDash,gantt:vGantt,prog:vProg,maes:vMaes,sect:vSect,hist:vHist,conf:vConf})[t]()}
const V=h=>$('#v').innerHTML=h;
const weekBar=()=>`<div class="bar"><button class="b" onclick="wk(-1)">◀</button><b>Semana</b><input type="number" id="sw" value="${S.w}" min="1" max="53" style="width:64px" onchange="S.w=+this.value;go(S.tab)">
 <input type="number" id="sy" value="${S.y}" style="width:80px" onchange="S.y=+this.value;go(S.tab)"><button class="b" onclick="wk(1)">▶</button><button class="b" onclick="wk(0)">Hoy</button>
 <span>${monday(S.y,S.w)} → ${add(monday(S.y,S.w),5)}</span></div>`;
function wk(n){if(!n){[S.y,S.w]=isoWeek(new Date())}else{const m=add(monday(S.y,S.w),7*n);[S.y,S.w]=isoWeek(new Date(m+'T12:00:00'))}go(S.tab)}

/* ===== Dashboard ===== */
function vDash(){const it=weekItems(),secs=new Set(it.map(i=>i.sec)),ha=[...secs].reduce((a,s)=>a+(S.sec.find(x=>x.id==s)?.ha||0),0);
 const cnt={};S.it.filter(i=>i.est!='ELIMINADO').forEach(i=>cnt[i.nombre]=(cnt[i.nombre]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]),mx=top[0]?top[0][1]:1,wkc={};
 S.it.filter(i=>i.est!='ELIMINADO').forEach(i=>{const k=isoWeek(new Date(i.ini+'T12:00:00'))[1];wkc['Sem '+k]=(wkc['Sem '+k]||0)+1});
 const bars=o=>Object.entries(o).map(([k,v])=>`<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="width:110px">${k}</span><div class="hb" style="width:${v/Math.max(...Object.values(o))*60}%"></div>${v}</div>`).join('');
 V(weekBar()+`<div class="cards">${[['Sectores programados',secs.size],['Productos programados',it.length],['Paquetes',secs.size],['Hectáreas',ha],
 ['Modificadas',S.hist.filter(h=>h.tipo!='CREACION').length],['No registrados',it.filter(i=>!i.reg).length]].map(c=>`<div class="card">${c[0]}<b>${c[1]}</b></div>`).join('')}</div>
 <div class="cards" style="grid-template-columns:1fr 1fr"><div class="box"><b>Productos más utilizados</b>${bars(Object.fromEntries(top))}</div><div class="box"><b>Aplicaciones por semana</b>${bars(wkc)}</div></div>`)}

/* ===== Gantt ===== */
function vGantt(){const m=monday(S.y,S.w),its=weekItems();
 let h=weekBar()+`<div class="gantt"><div class="gr gh"><div class="gl">Sector</div><div class="dys">${DAYS.map((d,i)=>`<div>${d} ${add(m,i).slice(8)}</div>`).join('')}</div></div>`;
 S.sec.filter(s=>s.act).forEach(s=>{const l=its.filter(i=>i.sec==s.id);h+=`<div class="gr"><div class="gl"><b>${s.id}</b><small>${s.ha} ha</small></div>
  <div class="dys" data-s="${s.id}" style="min-height:${Math.max(1,l.length)*28+8}px">${'<i></i>'.repeat(6)}${l.map((i,k)=>{const a=Math.max(0,dayIdx(i.ini,m)),b=Math.min(5,dayIdx(i.fin,m)),c=col(i.pid);
  return`<div class="ev ${i.est=='REPROGRAMADO'?'rp':''}" data-i="${i.id}" style="left:calc(${a}*100%/6 + 2px);width:calc(${b-a+1}*100%/6 - 4px);top:${4+k*28}px;background:${c};color:${tc(c)}">${i.nombre}${i.reg?'':' ⚠'}${i.est=='REPROGRAMADO'?' · REPROG.':''}<span class="h"></span></div>`}).join('')}</div></div>`});
 V(h+'</div><p style="color:#667">Clic en una celda vacía = nueva programación · arrastra una barra para mover · arrastra el borde derecho para extender · clic en la barra = ficha.</p>');
 document.querySelectorAll('.dys[data-s]').forEach(z=>z.addEventListener('click',e=>{if(e.target.tagName=='I'){const r=z.getBoundingClientRect();addDlg(z.dataset.s,Math.floor((e.clientX-r.left)/r.width*6))}}));
 document.querySelectorAll('.ev').forEach(el=>el.addEventListener('pointerdown',e=>drag(e,el)))}
function drag(e,el){const it=S.it.find(x=>x.id==el.dataset.i),m=monday(S.y,S.w),w=el.parentElement.getBoundingClientRect().width/6,rs=e.target.classList.contains('h'),x0=e.clientX;
 let dd=0;el.setPointerCapture(e.pointerId);el.style.cursor='grabbing';
 const mv=ev=>{dd=Math.round((ev.clientX-x0)/w);const a=dayIdx(it.ini,m),b=dayIdx(it.fin,m);
  if(rs){dd=Math.max(dd,a-b);dd=Math.min(dd,5-b);el.style.width=`calc(${b-a+1+dd}*100%/6 - 4px)`}else{dd=Math.max(dd,-a);dd=Math.min(dd,5-b);el.style.left=`calc(${a+dd}*100%/6 + 2px)`}};
 const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);
  if(Math.abs(ev.clientX-x0)<5){openSide(it.id);return}
  if(!dd){go('gantt');return}const o=it.ini+' a '+it.fin;if(rs)it.fin=add(it.fin,dd);else{it.ini=add(it.ini,dd);it.fin=add(it.fin,dd)}
  log(rs?'DURACION':'CAMBIO_FECHAS',it,{ant:o,nue:it.ini+' a '+it.fin,motivo:'Arrastre en Gantt'});sv('moverProducto',it);go('gantt')};
 el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)}

/* ===== Nueva programación (buscador + no registrado) ===== */
function addDlg(sec,di){const m=monday(S.y,S.w);$('#side').innerHTML=`<h3>Nueva programación · ${sec}</h3><label>Buscar producto</label><input id="q" list="pl" placeholder="Ej: CAP Ajo" oninput="qInfo()">
 <datalist id="pl">${S.prod.map(p=>`<option value="${p.nombre}">`).join('')}</datalist><div id="qi"></div>
 <label>Inicio</label><input type="date" id="ai" value="${add(m,di)}"><label>Término</label><input type="date" id="af" value="${add(m,di)}">
 <p><button class="b p" onclick="addOk('${sec}')">Agregar</button> <button class="b" onclick="$('#side').classList.remove('open')">Cancelar</button></p>`;$('#side').classList.add('open')}
function qInfo(){const p=S.prod.find(x=>x.nombre.toLowerCase()==$('#q').value.trim().toLowerCase());
 $('#qi').innerHTML=!$('#q').value?'':p?`<div class="res">Dosis: <b>${p.dosis} ${p.u}</b><br>Mojamiento: ${p.moj} L/ha<br>Rango: ${p.min||'—'} a ${p.max||'—'}</div>`
 :`<div class="res" style="background:#ffebee"><span class="tag">PRODUCTO NO REGISTRADO</span><br>Se agregará como no autorizado.<br><button class="b" onclick="solicita()">Solicitar incorporación al maestro</button></div>`}
function solicita(){log('SOLICITUD_PRODUCTO',{sec:'-',nombre:$('#q').value},{motivo:'Solicitud de incorporación al maestro'});alert('Solicitud registrada en el historial.')}
function addOk(sec){const n=$('#q').value.trim(),p=S.prod.find(x=>x.nombre.toLowerCase()==n.toLowerCase());if(!n||$('#af').value<$('#ai').value)return alert('Revisa producto y fechas');
 const it={id:uid(),sec,pid:p?p.id:'',nombre:p?p.nombre:n,reg:!!p,ini:$('#ai').value,fin:$('#af').value,d0:p?p.dosis:'',d:p?p.dosis:'',u:p?p.u:'mL/L',moj:p?p.moj:S.cap,est:'ACTIVO',obs:''};
 S.it.push(it);log('CREACION',it,{nue:it.ini+' a '+it.fin,motivo:'Nueva programación'});sv('guardarProgramacion',it);go(S.tab)}

/* ===== Ficha técnica + calculadora + reprogramar ===== */
const MOT=['Decisión de reunión','Cambio climático/lluvia','Falta de stock','Plaga/enfermedad detectada','Ajuste de dosis','Otro'];
function openSide(id){const i=S.it.find(x=>x.id==id),s=S.sec.find(x=>x.id==i.sec);
 $('#side').innerHTML=`<h3 style="color:${col(i.pid)}">● ${i.nombre} ${i.reg?'':'<span class="tag">NO REGISTRADO</span>'}</h3>
 <div>Sector <b>${i.sec}</b> · Semana ${S.w} · <b>${s.ha} ha</b> · <span>${i.est}</span></div>
 <label>Inicio</label><input type="date" id="fi" value="${i.ini}"><label>Término</label><input type="date" id="ff" value="${i.fin}">
 <label>Dosis (${i.u}) — original: ${i.d0===''?'—':i.d0}</label><input type="number" step="any" id="fd" value="${i.d}" oninput="rc('${id}')">
 <label>Mojamiento (L/ha)</label><input type="number" id="fm" value="${i.moj}" oninput="rc('${id}')"><label>Observaciones</label><input id="fo" value="${i.obs}">
 <div class="res" id="rs"></div>
 <p><button class="b p" onclick="saveIt('${id}')">EDITAR (guardar)</button> <button class="b" onclick="rep('${id}')">REPROGRAMAR</button>
 <button class="b d" onclick="del('${id}')">ELIMINAR</button> <button class="b" onclick="S.fh='${id}';go('hist')">VER HISTORIAL</button></p><div id="rp"></div>`;
 $('#side').classList.add('open');rc(id)}
function rc(id){const i=S.it.find(x=>x.id==id),s=S.sec.find(x=>x.id==i.sec),r=$('#fd').value===''?null:calc(+$('#fd').value,i.u,+$('#fm').value,S.cap,s.ha);
 $('#rs').innerHTML=r?`Cilindros/ha: <b>${+r.cph.toFixed(2)}</b> · Dosis/cilindro: <b>${big(r.pc,r.u)}</b><br>Dosis/ha: <b>${big(r.ph,r.u)}</b> · Cilindros: <b>${r.cil}</b><br>Total requerido: <b>${big(r.tot,r.u)}</b><br><small>Dosis original ${i.d0===''?'—':i.d0} → modificada ${$('#fd').value} ${i.u}</small>`:'Ingresa una dosis para calcular (no se asume ninguna).'}
function saveIt(id){const i=S.it.find(x=>x.id==id),o={a:i.ini+' a '+i.fin,d:i.d};i.ini=$('#fi').value;i.fin=$('#ff').value;i.d=$('#fd').value===''?'':+$('#fd').value;i.moj=+$('#fm').value;i.obs=$('#fo').value;
 log('EDICION',i,{ant:o.a+' | dosis '+o.d,nue:i.ini+' a '+i.fin+' | dosis '+i.d,motivo:'Edición manual'});sv('moverProducto',i);go('gantt')}
function del(id){if(!confirm('¿Eliminar esta programación? Quedará en el historial.'))return;const i=S.it.find(x=>x.id==id);i.est='ELIMINADO';log('ELIMINACION',i,{motivo:'Eliminado por usuario'});go('gantt')}
function rep(id){const i=S.it.find(x=>x.id==id);$('#rp').innerHTML=`<hr><b>Reemplazar por:</b><select id="rn">${S.prod.map(p=>`<option>${p.nombre}</option>`).join('')}</select>
 <label>Nuevo inicio</label><input type="date" id="ri" value="${i.ini}"><label>Nuevo término</label><input type="date" id="rf" value="${i.fin}">
 <label>Motivo</label><select id="rm">${MOT.map(m=>`<option>${m}</option>`).join('')}</select><input id="rt" placeholder="Detalle (opcional)">
 <p><button class="b p" onclick="repOk('${id}')">Confirmar reprogramación</button></p>`}
function repOk(id){const i=S.it.find(x=>x.id==id),p=S.prod.find(x=>x.nombre==$('#rn').value);i.est='REPROGRAMADO';
 const n={id:uid(),sec:i.sec,pid:p.id,nombre:p.nombre,reg:true,ini:$('#ri').value,fin:$('#rf').value,d0:p.dosis,d:p.dosis,u:p.u,moj:p.moj,est:'ACTIVO',obs:'Reemplaza a '+i.nombre};S.it.push(n);
 log('REEMPLAZO',n,{prod:i.nombre+' → '+p.nombre,ant:i.ini+' a '+i.fin+' | dosis '+i.d,nue:n.ini+' a '+n.fin+' | dosis '+n.d,motivo:$('#rm').value+($('#rt').value?': '+$('#rt').value:'')});sv('reemplazarProducto',{i,n});go('gantt')}

/* ===== Programación (lista), Maestro, Sectores, Historial, Config ===== */
function vProg(){const l=weekItems();V(weekBar()+`<table><tr><th>Sector</th><th>Producto</th><th>Inicio</th><th>Fin</th><th>Dosis</th><th>Total</th><th>Estado</th></tr>${l.map(i=>{const s=S.sec.find(x=>x.id==i.sec),r=i.d===''?null:calc(+i.d,i.u,i.moj,S.cap,s.ha);
 return`<tr style="cursor:pointer" onclick="openSide('${i.id}')"><td>${i.sec}</td><td><span style="color:${col(i.pid)}">●</span> ${i.nombre} ${i.reg?'':'<span class="tag">NO REG.</span>'}</td><td>${i.ini}</td><td>${i.fin}</td><td>${i.d} ${i.u}</td><td>${r?big(r.tot,r.u):'—'}</td><td>${i.est}</td></tr>`}).join('')}</table>`)}
function vMaes(){V(`<div class="bar"><input id="mq" placeholder="Buscar producto…" oninput="mf()"><button class="b p" onclick="newP()">+ Producto</button></div><div id="mt"></div>`);mf()}
function mf(){const q=($('#mq')?.value||'').toLowerCase();$('#mt').innerHTML=`<table><tr><th>Color</th><th>Producto</th><th>Unidad</th><th>Dosis</th><th>Mín–Máx</th><th>Mojam.</th><th>Autorizado</th></tr>${S.prod.filter(p=>p.nombre.toLowerCase().includes(q)).map(p=>
 `<tr><td><input type="color" value="${p.color}" onchange="S.prod.find(x=>x.id=='${p.id}').color=this.value"></td><td>${p.nombre}</td><td>${p.u}</td><td>${p.dosis}</td><td>${p.min||'—'}–${p.max||'—'}</td><td>${p.moj} L/ha</td><td><span class="tag ok">Sí</span></td></tr>`).join('')}</table>`}
function newP(){const n=prompt('Nombre comercial:');if(!n)return;const u=prompt('Unidad de dosis (mL/L, g/L, mL/cil, g/cil, mL/ha, kg/ha…):','mL/L'),d=+prompt('Dosis predeterminada:');
 const pal=['#00acc1','#e53935','#6d4c41','#ec407a','#7cb342','#5c6bc0','#26a69a'];S.prod.push({id:uid(),nombre:n,u,dosis:d,min:'',max:'',moj:S.cap,color:pal[S.prod.length%pal.length],aut:true});mf()}
function vSect(){V(`<div class="bar"><button class="b p" onclick="newS()">+ Sector</button></div><table><tr><th>Código</th><th>Nombre</th><th>Fundo</th><th>Hectáreas</th><th>Estado</th></tr>${S.sec.map(s=>
 `<tr><td>${s.id}</td><td>${s.nombre}</td><td>${s.fundo}</td><td><input type="number" value="${s.ha}" style="width:80px" onchange="S.sec.find(x=>x.id=='${s.id}').ha=+this.value"></td>
 <td><button class="b" onclick="S.sec.find(x=>x.id=='${s.id}').act=${!s.act};vSect()">${s.act?'Activo · desactivar':'Inactivo · reactivar'}</button></td></tr>`).join('')}</table>`)}
function newS(){const c=prompt('Código:');if(!c)return;S.sec.push({id:c,nombre:prompt('Nombre:',c),fundo:prompt('Fundo:'),ha:+prompt('Hectáreas:'),act:true});vSect()}
function vHist(){const f=S.fh?S.hist.filter(h=>S.it.find(i=>i.id==S.fh&&i.sec==h.sec&&i.nombre==h.prod.split(' → ').pop())):S.hist;S.fh=null;
 V(`<table><tr><th>Fecha</th><th>Tipo</th><th>Sector</th><th>Producto</th><th>Anterior</th><th>Nuevo</th><th>Motivo</th><th>Usuario</th></tr>${f.map(h=>`<tr><td>${h.f}</td><td>${h.tipo}</td><td>${h.sec}</td><td>${h.prod}</td><td>${h.ant||''}</td><td>${h.nue||''}</td><td>${h.motivo||''}</td><td>${h.usr}</td></tr>`).join('')||'<tr><td colspan=8>Sin modificaciones aún</td></tr>'}</table>`)}
function vConf(){V(`<div class="box">Capacidad del cilindro (L): <input type="number" value="${S.cap}" onchange="S.cap=+this.value"><p>La conexión con Google Sheets se activa en la Etapa 7.</p></div>`)}
go('gantt');
</script></body></html>
